name: Configure upload retention
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install S3 client
        run: python -m pip install boto3
      - name: Configure and verify retention and remove expired uploads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python .github/scripts/expire_uploads.py
