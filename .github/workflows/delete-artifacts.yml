name: Delete stored run artifacts

# Run by hand (Actions > Delete stored run artifacts > Run workflow). Deletes every artifact that
# earlier runs of this repository stored (uploaded worksheets and results). Process CSV API no
# longer stores any, so this is only needed once; it is safe to run again.

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            for (const a of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id
              });
            }
            const left = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 1
            });
            console.log(`Deleted ${artifacts.length} artifacts; ${left.data.total_count} left.`);
            if (left.data.total_count > 0) core.setFailed('Some artifacts are left; run the workflow again.');
