name: Process CSV API

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to send results to'
        required: true
      file_url:
        description: 'CSV file URL'
        required: true
      job:
        description: 'impacts = food impact results; stars / aia = add AASHE STARS / Anchors in Action dropdowns'
        required: false
        default: 'impacts'
        type: choice
        options:
          - impacts
          - stars
          - aia
      filename:
        description: 'Optional: name of the uploaded worksheet, to name the results after (e.g. usfoods_AIAplus.xlsx)'
        required: false
        default: ''
  repository_dispatch:
    types: [process-csv]

permissions:
  id-token: write
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Process Request
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Event name:', context.eventName);
            let body;
            if (context.eventName === 'repository_dispatch') {
              body = context.payload.client_payload;
            } else if (context.eventName === 'workflow_dispatch') {
              body = {
                email: context.payload.inputs.email,
                file_url: context.payload.inputs.file_url,
                job: context.payload.inputs.job,
                filename: context.payload.inputs.filename
              };
              console.log('Manual trigger has email:', !!body.email, '- file URL:', !!body.file_url);
            } else {
              console.warn('Unknown event type, no inputs provided');
              body = {};
            }

            if (!body.email || !body.file_url) {
              core.setOutput('statusCode', '400');
              core.setFailed('Missing required fields');
              return;
            }

            // Privacy: the run logs of this public repository show *** instead of the email address and
            // the link to the uploaded file (both are still used by the steps below)
            core.setSecret(body.email);
            core.setSecret(body.file_url);

            // Job type: impacts (default, also for requests without one), stars or aia
            const job = ['stars', 'aia'].includes(body.job) ? body.job : 'impacts';
            console.log('Job:', job);

            // Results are named after the uploaded worksheet, as when the notebooks run locally:
            // usfoods_AIA.xlsx -> usfoods_AIAplus.xlsx (stars / aia); usfoods_AIAplus.xlsx ->
            // categories_usfoods_AIAplus.csv etc. in usfoods_AIAplus_results.zip (impacts).
            // The name keeps letters, digits, - and _ (others become _), at most 60 characters.
            // Without a name, results are named as before (output.zip, worksheet_<job>_dropdowns.xlsx).
            const original = String(body.filename || '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 200);
            const base = original.replace(/\.[A-Za-z0-9]{1,5}$/, '').replace(/[^A-Za-z0-9_-]+/g, '_')
              .replace(/^[_-]+|[_-]+$/g, '').slice(0, 60).replace(/[_-]+$/, '');
            // Privacy: worksheet names can name the institution, so the logs show *** for them too
            if (original.length >= 4) core.setSecret(original);
            if (base.length >= 4) core.setSecret(base);
            console.log('Named after the uploaded worksheet:', !!base);
            const framework = job === 'stars' ? 'AASHE STARS' : 'Anchors in Action';
            const forName = original ? ` (${original})` : '';

            // Set outputs to be used in later steps.
            core.setOutput('statusCode', '200');
            core.setOutput('email', body.email);
            core.setOutput('file_url', body.file_url);
            core.setOutput('job', job);
            core.setOutput('base_name', base);
            core.setOutput('zip_name', base ? `${base}_results.zip` : 'output.zip');
            core.setOutput('dropdown_name', base ? `${/plus$/i.test(base) ? base : base + 'plus'}.xlsx` : `worksheet_${job}_dropdowns.xlsx`);
            core.setOutput('results_subject', `Your food impact results${forName}`);
            core.setOutput('dropdown_subject', `Your worksheet with ${framework} dropdowns${forName}`);
            core.setOutput('problem_subject', `Your worksheet could not be processed${forName}`);

      - name: Build Docker image
        if: steps.process.outputs.statusCode == '200'
        run: docker build -t food-impact .

      - name: Download CSV
        if: steps.process.outputs.statusCode == '200'
        env:
          FILE_URL: ${{ steps.process.outputs.file_url }}
        run: |
          curl -L "$FILE_URL" > input.csv

      # Privacy: the uploaded worksheet and the results are only emailed, never kept as run artifacts
      # (the runner and its files are discarded when the run ends)

      - name: Process CSV
        if: steps.process.outputs.statusCode == '200'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOB_TYPE: ${{ steps.process.outputs.job }}
          BASE_NAME: ${{ steps.process.outputs.base_name }}
          ZIP_NAME: ${{ steps.process.outputs.zip_name }}
          DROPDOWN_NAME: ${{ steps.process.outputs.dropdown_name }}
        run: |
          docker run -v $(pwd):/app/host -e OPENAI_API_KEY -e JOB_TYPE -e BASE_NAME -e ZIP_NAME -e DROPDOWN_NAME food-impact

      - name: Send email
        if: steps.process.outputs.statusCode == 200 && steps.process.outputs.job == 'impacts'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.process.outputs.results_subject }}
          to: ${{ steps.process.outputs.email }}
          from: Food Impact Processor
          body: Please find your processed CSV results attached.
          attachments: ./${{ steps.process.outputs.zip_name }}

      # Dropdown jobs (stars / aia): email the worksheet with dropdowns, or why it failed

      - name: Read dropdown email text
        id: dropdown
        if: steps.process.outputs.statusCode == '200' && steps.process.outputs.job != 'impacts'
        env:
          DROPDOWN_NAME: ${{ steps.process.outputs.dropdown_name }}
        run: |
          if [ -f "$DROPDOWN_NAME" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo 'text<<END_OF_EMAIL_TEXT'
            if [ -f email_body.txt ]; then cat email_body.txt; else echo "Sorry, your worksheet could not be processed. Please try again later."; fi
            echo 'END_OF_EMAIL_TEXT'
          } >> "$GITHUB_OUTPUT"

      - name: Send worksheet with dropdowns
        if: steps.dropdown.outputs.ok == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.process.outputs.dropdown_subject }}
          to: ${{ steps.process.outputs.email }}
          from: Food Impact Processor
          body: ${{ steps.dropdown.outputs.text }}
          attachments: ./${{ steps.process.outputs.dropdown_name }}

      - name: Send dropdown problem email
        if: steps.dropdown.outputs.ok == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.process.outputs.problem_subject }}
          to: ${{ steps.process.outputs.email }}
          from: Food Impact Processor
          body: ${{ steps.dropdown.outputs.text }}
